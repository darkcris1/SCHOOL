<div 
  style="min-height: 80vh;"
  class="container d-flex justify-content-center align-items-center">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px">
    <div class="card-body">
      <h4 class="card-title text-center">Login</h4>

      <!-- General error message -->
      <div *ngIf="loginError" class="alert alert-danger">
        {{ loginError }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            id="username"
            formControlName="username"
            type="text"
            class="form-control"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched || fieldErrors['username']"
          />
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="invalid-feedback">
            Username is required.
          </div>
          <!-- Field-specific errors for username -->
          <div *ngIf="fieldErrors['username']" class="invalid-feedback">
            <div *ngFor="let error of fieldErrors['username']">
              {{ error }}
            </div>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            formControlName="password"
            type="password"
            class="form-control"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched || fieldErrors['password']"
          />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
            Password is required.
          </div>
          <!-- Field-specific errors for password -->
          <div *ngIf="fieldErrors['password']" class="invalid-feedback">
            <div *ngFor="let error of fieldErrors['password']">
              {{ error }}
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
          Login
        </button>
      </form>

      <!-- Register Link -->
      <div class="mt-3 text-center">
        <p>Don't have an account? <a routerLink="/register" class="link-primary">Register here</a></p>
      </div>
    </div>
  </div>
</div>
